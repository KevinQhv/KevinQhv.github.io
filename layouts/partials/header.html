<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="/" {{ if .IsHome }}aria-current="page"{{ end }}>Kévin Quénéhervé</a>
    <nav aria-label="Main">
      <ul>
        {{ $current := . }}
        {{ range site.Menus.main }}
          {{ $active := and .Page (eq .Page.RelPermalink $current.RelPermalink) }}
          <li><a href="{{ .URL }}" {{ if $active }}aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>
