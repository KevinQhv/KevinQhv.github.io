- kind: poster
  title: Characterizing Clock Glitching Attacks on CVA6 PMP Configuration Flow
  authors: [Kévin Quénéhervé, William Pensec, Philippe Tanguy, Rachid Dafali, Vianney Lapôtre]
  venue: CYBERUS Spring School
  venue_short: CYBERUS 2024
  place: Lorient, France
  date: "2024"
  links:
    - { label: "HAL", url: "https://hal.science/hal-04729593" }
  abstract: >-
    Nashimoto et al. showed that the Physical Memory Protection (PMP) configuration
    registers of a RISC-V processor can be modified through clock-glitch fault injection,
    but did not study the consequences of those faults on the registers themselves. This
    poster investigates the effects of clock glitching on the PMP configuration flow of a
    CVA6 RISC-V core.
