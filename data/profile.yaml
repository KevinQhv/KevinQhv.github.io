thesis:
  title: Design of a RISC-V embedded processor tolerant to faults induced by physical attacks
  title_fr: Étude et développement d'un processeur embarqué RISC-V tolérant aux fautes induites par des attaques physiques
  started: September 2023
  school: Doctoral school MathSTIC, Université Bretagne Sud
  url: https://theses.fr/s369423
  supervisors:
    - name: Vianney Lapôtre
      affiliation: Université Bretagne Sud, Lab-STICC
    - name: Philippe Tanguy
      affiliation: Université Bretagne Sud, Lab-STICC
    - name: Rachid Dafali
      affiliation: DGA Maîtrise de l'information
  summary: >-
    Physical attacks such as clock glitches, voltage glitches and electromagnetic
    pulses can flip bits inside a processor and silently break its security
    mechanisms. My thesis first characterises these faults on real hardware — an
    open-source CVA6 RISC-V core running on an FPGA — and then builds countermeasures
    that combine dedicated hardware extensions of the core and its instruction set
    with software-level protections, so that both data flow and control flow stay
    trustworthy under attack.

interests:
  - Fault injection attacks (clock & voltage glitching)
  - RISC-V microarchitecture (CVA6)
  - Physical Memory Protection (PMP)
  - Hardware countermeasures & error-detecting codes
  - FPGA prototyping with LiteX
