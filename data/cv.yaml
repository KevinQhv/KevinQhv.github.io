experience:
  - title: PhD candidate — secure processor architecture
    org: Lab-STICC, Université Bretagne Sud
    place: Lorient, France
    period: 2023 – present
    text: >-
      Making embedded RISC-V processors resilient to physical attacks. I characterise
      fault injection attacks against data flow and control flow on a CVA6 core
      prototyped on FPGA, then design countermeasures that combine hardware extensions of
      the processor and its instruction set with software-level protections. Supervised by
      Vianney Lapôtre, Philippe Tanguy (UBS) and Rachid Dafali (DGA MI).
    skills: [FPGA development, CVA6 / RISC-V, Fault injection, ChipWhisperer, C, Assembly, Python, RTOS, Linux]

  - title: Research intern (Master 2)
    org: Lab-STICC, Université Bretagne Sud
    place: Lorient, France
    period: 2023 · 6 months
    text: >-
      Reproduced and extended the attack on RISC-V Physical Memory Protection described by
      <a href="https://tches.iacr.org/index.php/TCHES/article/view/9289">Nashimoto et al.</a>
      I built a system-on-chip around the CVA6 core on an Arty A7-100T board with the
      <a href="https://github.com/enjoy-digital/litex">LiteX</a> framework and attacked it
      with clock glitches.
    skills: [FPGA development, LiteX, ChipWhisperer, PMP, Python, C, Assembly]

  - title: Research intern (Master 1)
    org: Lab-STICC, Université Bretagne Sud
    place: Lorient, France
    period: 2022 · 3 months
    text: >-
      Evaluated how sensitive a RISC-V processor is to physical attacks, using clock
      glitches and voltage pulses against a LiteX-generated system-on-chip.
    skills: [FPGA development, ChipWhisperer, Fault injection, Python, C, Assembly]

